# Publishes the app to GitHub Pages from the main branch.
# A Pages deploy replaces the whole site, so every run rebuilds it from scratch.
name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages for OIDC authentication.
  id-token: write

# Only one deployment runs at a time. A newer run cancels an older one still in progress,
# so the last commit pushed is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate for publishing: deploy only runs if this job succeeds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run bundle

      # Unique per run attempt. A re-run of this job would otherwise upload a second
      # "github-pages" artifact, and deploy-pages fails when it finds more than one.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
