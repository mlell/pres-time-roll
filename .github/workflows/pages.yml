# Publishes two versions of the app to one GitHub Pages site:
#   /         -> the newest v* tag (stable)
#   /staging/ -> the current main branch
# A Pages deploy replaces the whole site, so both versions are rebuilt on every run.
name: Deploy Pages

on:
  # Runs on main pushes (refresh staging) and on tag pushes (refresh stable).
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages for OIDC authentication.
  id-token: write

# Only one deployment runs at a time. A newer run cancels an older one still in progress,
# so the last commit or tag pushed is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate for publishing: deploy only runs if this job succeeds.
  test:
    runs-on: ubuntu-latest
    steps:
      # Checked out into separate directories because both versions are needed side by side.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: staging

      # Full history and tags are needed to find the newest v* tag.
      - uses: actions/checkout@v4
        with:
          path: stable
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test staging (main)
        working-directory: staging
        run: |
          npm ci
          npm test

      # Sorts numerically (v1.10 after v1.9). Fails if no v* tag exists.
      - name: Test stable (latest v* tag)
        working-directory: stable
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          : "${tag:?no v* tag found}"
          git checkout "$tag"
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same checkout layout as the test job, so both jobs build the same code.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: staging

      - uses: actions/checkout@v4
        with:
          path: stable
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build staging (main)
        working-directory: staging
        run: |
          npm ci
          npm run bundle

      # Same tag selection as the test job. Keep the two in sync.
      - name: Build stable (latest v* tag)
        working-directory: stable
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          : "${tag:?no v* tag found}"
          git checkout "$tag"
          npm ci
          npm run bundle

      # The bundle is a single self-contained HTML file, so it is copied as index.html
      # in each directory. Stable goes at the root and staging in /staging/.
      - name: Assemble site
        run: |
          mkdir -p _site/staging
          cp stable/classtimer_bundle.html _site/index.html
          cp staging/classtimer_bundle.html _site/staging/index.html

      # Unique per run attempt. A re-run of this job would otherwise upload a second
      # "github-pages" artifact, and deploy-pages fails when it finds more than one.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
