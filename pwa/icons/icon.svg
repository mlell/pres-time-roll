<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b5966"/>
      <stop offset="100%" stop-color="#234046"/>
    </linearGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#grad)" />

  <!-- 12 segments -->
  <g transform="translate(60,60)">
    ${Array.from({ length: 12 }).map((_, i) => {
      const rotate = i * 30 - 90;
      const opacity = (i % 3 === 0) ? 1 : 0.6;
      return `<g transform="rotate(${rotate})"><rect x="30" y="-6" width="18" height="12" rx="6" fill="#6f93a0" opacity="${opacity}" /></g>`;
    }).join('\n    ')}
  </g>

  <!-- inner white circle -->
  <circle cx="60" cy="60" r="34" fill="#ffffff" />

  <!-- play triangle -->
  <polygon points="70,60 50,72 50,48" fill="#234046" />
</svg>
