<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom PDF Presenter</title>
    <meta name="theme-color" content="#1d4ed8">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="lib/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="pdf-viewer" id="pdfViewer">
            <div class="drop-zone" id="dropZone">
                <p>Drag and drop a PDF or remark.js file here</p>
            </div>
            <canvas id="pdfCanvas" hidden></canvas>
        </div>
        <div class="remark-viewer" id="remarkViewer" style="display: none;">
            <div class="drop-zone" id="remarkDropZone">
                <p>Drag and drop a remark.js file here</p>
            </div>
            <iframe id="remarkFrame" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>

        <div class="sidebar" id="sidebar">
            <div class="timer-section">
                <div class="timer-visual">
                    <svg class="timer-circle" viewBox="0 0 120 120">
                        <circle class="segment" data-segment="1" style="--i: 0" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-90 60 60)"/>
                        <circle class="segment" data-segment="2" style="--i: 1" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-60 60 60)"/>
                        <circle class="segment" data-segment="3" style="--i: 2" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-30 60 60)"/>
                        <circle class="segment" data-segment="4" style="--i: 3" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(0 60 60)"/>
                        <circle class="segment" data-segment="5" style="--i: 4" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(30 60 60)"/>
                        <circle class="segment" data-segment="6" style="--i: 5" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(60 60 60)"/>
                        <circle class="segment" data-segment="7" style="--i: 6" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(90 60 60)"/>
                        <circle class="segment" data-segment="8" style="--i: 7" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(120 60 60)"/>
                        <circle class="segment" data-segment="9" style="--i: 8" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(150 60 60)"/>
                        <circle class="segment" data-segment="10" style="--i: 9" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(180 60 60)"/>
                        <circle class="segment" data-segment="11" style="--i: 10" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(210 60 60)"/>
                        <circle class="segment" data-segment="12" style="--i: 11" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(240 60 60)"/>
                    </svg>
                    <div class="timer-center">
                        <div class="timer-display" id="timerDisplay">0</div>
                        <div class="timer-main-controls">
                            <button id="startPauseBtn" class="time-btn" title="Start / Pause">
                                <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                            </button>
                            <button id="resetBtn" class="time-btn" title="Reset">
                                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="timer-controls">
                    <button class="time-btn" data-minutes="1">+1m</button>
                    <button class="time-btn" data-minutes="3">+3m</button>
                    <button class="time-btn" data-minutes="5">+5m</button>
                </div>

            </div>

            <div class="die-section">
                <div class="die-display" id="dieDisplay">
                    <div class="die-face">
                        <span id="studentName"></span>
                        <span class="die-hint" id="dieHint">Textdatei mit Schüler:innen-Namen hier ablegen</span>
                        <button class="open-file-btn" id="openFileBtn" title="Open student list">
                            <svg viewBox="0 0 24 24"><path d="M8 16h8v2H8zm0-4h8v2H8zm6-10H6c-1.1 0-2 .9-2 2v16c0 1.1.99 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
                        </button>
                        <button class="delete-btn" id="deleteBtn" title="Delete students" hidden>✕</button>
                        <div class="delete-confirmation" id="deleteConfirmation" style="display: none;">
                            <span>Löschen?</span>
                            <button class="confirm-btn" id="confirmDelete">✓</button>
                            <button class="cancel-btn" id="cancelDelete">✕</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="presentation-controls">
                <button class="control-btn" id="prevPage" title="Previous">◀</button>
                <button class="control-btn" id="nextPage" title="Next">▶</button>
                <button class="control-btn reset-presentation-btn" id="resetPresentationBtn" title="Reset presentation">✕</button>
            </div>
        </div>
    </div>

    <script src="lib/js/remark.min.js"></script>
    <script src="lib/js/bundle.js"></script>
</body>
</html>
