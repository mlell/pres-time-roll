<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom PDF Presenter</title>
    <link rel="stylesheet" href="lib/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="pdf-viewer" id="pdfViewer">
            <div class="drop-zone" id="dropZone">
                <p>Drag and drop a PDF file here</p>
            </div>
            <canvas id="pdfCanvas"></canvas>
            <div class="pdf-controls" id="pdfControls" style="display: none;">
                <button id="prevPage">Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button id="nextPage">Next</button>
            </div>
        </div>
        
        <div class="resize-handle" id="resizeHandle"></div>
        
        <div class="sidebar" id="sidebar">
            <div class="timer-section">
                <div class="timer-visual">
                    <svg class="timer-circle" viewBox="0 0 120 120">
                        <circle class="segment" data-segment="1" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-90 60 60)"/>
                        <circle class="segment" data-segment="2" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-60 60 60)"/>
                        <circle class="segment" data-segment="3" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(-30 60 60)"/>
                        <circle class="segment" data-segment="4" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(0 60 60)"/>
                        <circle class="segment" data-segment="5" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(30 60 60)"/>
                        <circle class="segment" data-segment="6" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(60 60 60)"/>
                        <circle class="segment" data-segment="7" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(90 60 60)"/>
                        <circle class="segment" data-segment="8" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(120 60 60)"/>
                        <circle class="segment" data-segment="9" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(150 60 60)"/>
                        <circle class="segment" data-segment="10" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(180 60 60)"/>
                        <circle class="segment" data-segment="11" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(210 60 60)"/>
                        <circle class="segment" data-segment="12" cx="60" cy="60" r="50" fill="none" stroke="#34495e" stroke-width="8" stroke-dasharray="23 291" transform="rotate(240 60 60)"/>
                    </svg>
                    <div class="timer-display" id="timerDisplay">00:00</div>
                </div>
                <div class="timer-controls">
                    <button class="time-btn" data-minutes="1">+1m</button>
                    <button class="time-btn" data-minutes="3">+3m</button>
                    <button class="time-btn" data-minutes="5">+5m</button>
                </div>
                <div class="timer-main-controls">
                    <button id="startPauseBtn">Start</button>
                    <button id="resetBtn">Reset</button>
                </div>
            </div>
            
            <div class="die-section">
                <div class="die-display" id="dieDisplay">
                    <div class="die-face">
                        <span id="studentName">Drop file here or click to roll</span>
                    </div>
                </div>
                <div class="die-controls">
                    <button id="rollBtn">Roll</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="lib/js/bundle.js"></script>
</body>
</html>
